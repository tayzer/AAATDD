# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit is an advisory reviewer. It does not satisfy the code-owner review
# requirement and must never be treated as business approval of Gherkin.
language: en-GB
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    base_branches: [main]
  path_filters:
    - '!**/.tada/**'
    - '!**/packages.lock.json'
    - '!.artifacts/**'
  path_instructions:
    - path: 'src/**/*.cs'
      instructions: >-
        TADA must keep PASS, FAIL and INDETERMINATE distinct; native runner
        success alone is not a TADA PASS. Oracle files are hashed as exact bytes,
        and baseline, review and approval records are immutable. Flag code that
        weakens these guarantees, discards failures or gaps, or creates approvals
        outside explicitly labelled isolated test controls.
    - path: 'tests/**'
      instructions: >-
        Automated fixtures may create approvals only when explicitly labelled as
        controls in isolated test projects. Flag tests that treat such approvals
        as requester acceptance.
    - path: '**/*.feature'
      instructions: >-
        Business Gherkin needs human agreement. Comment on clarity only; do not
        suggest new business scenarios or imply the expectations are approved.
    - path: '.github/**'
      instructions: >-
        Treat workflow and policy changes as executable infrastructure. Keep
        actions pinned to commit SHAs, least-privilege tokens and credentials
        removed from checkout. Flag changes to the `PR checks` gate.
chat:
  auto_reply: true
