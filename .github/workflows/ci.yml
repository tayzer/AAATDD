name: PR validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  # The release workflow runs the same validation for a tag before it drafts a release.
  workflow_call:
permissions:
  contents: read
defaults:
  run:
    shell: pwsh
concurrency:
  group: tada-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows validation (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [core, orders, multi-service, enforcement, onboarding, earlier-sdk]
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Disable real-time scanning on the ephemeral runner
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            Write-Host 'Real-time scanning disabled for this job.'
          }
          catch { Write-Warning "Real-time scanning remains enabled: $_" }
      - name: Record validation identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          New-Item -ItemType Directory -Path .artifacts -Force | Out-Null
          $identity = [ordered]@{
            repository = $env:GITHUB_REPOSITORY
            event = $env:GITHUB_EVENT_NAME
            commit = $env:GITHUB_SHA
            prHead = $env:PR_HEAD_SHA
            prBase = $env:PR_BASE_SHA
            suite = '${{ matrix.suite }}'
            run = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
          }
          $identity | ConvertTo-Json | Set-Content .artifacts/ci-identity.json
          $identity.GetEnumerator() | ForEach-Object { "- $($_.Key) = $($_.Value)" } | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.103
            10.0.403
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .artifacts/native-toolchain
          key: zig-windows-x64-0.15.2-3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c
      - name: Restore locked core and test graphs
        run: |
          dotnet restore tests/Tada.Core.Tests/Tada.Core.Tests.csproj --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet restore src/Tada.Cli/Tada.Cli.csproj --locked-mode
      # Every suite builds the test project because it also builds the native fixtures
      # that the end-to-end controls use.
      - name: Build core, CLI and native fixtures
        run: dotnet build tests/Tada.Core.Tests/Tada.Core.Tests.csproj --no-restore --disable-build-servers -c Release
      - name: Run focused/replay tests
        if: matrix.suite == 'core'
        run: |
          dotnet tests/Tada.Core.Tests/bin/Release/net10.0/Tada.Core.Tests.dll --progress off --no-ansi | Tee-Object .artifacts/core-tests.log
          exit $LASTEXITCODE
      - name: Pack the tool
        run: dotnet pack src/Tada.Cli/Tada.Cli.csproj --no-restore --disable-build-servers -o .artifacts/packages
      - name: Orders end-to-end and negative controls
        if: matrix.suite == 'orders'
        run: pwsh -File scripts/Test-OrdersWorkflow.ps1
      - name: Multi-level and multi-service installed-package controls
        if: matrix.suite == 'multi-service'
        run: pwsh -File scripts/Test-MultiServiceWorkflow.ps1
      - name: Enforcement lifecycle controls
        if: matrix.suite == 'enforcement'
        run: pwsh -File scripts/Test-EnforcementWorkflow.ps1
      - name: Package the TADA plugin and check project setup
        if: matrix.suite == 'core'
        run: |
          [xml]$properties = Get-Content Directory.Build.props -Raw
          $version = [string]$properties.Project.PropertyGroup.Version
          $plugin = & ./scripts/New-TadaPlugin.ps1 -Package ".artifacts/packages/Tada.Cli.$version.nupkg"
          pwsh -File scripts/Test-TadaPlugin.ps1 -PluginRoot $plugin.pluginRoot -Archive $plugin.archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -File scripts/Test-TadaPlugin.ps1 -PluginRoot $plugin.pluginRoot -SdkVersion 10.0.103
      - name: Installed-package onboarding and second API
        if: matrix.suite == 'onboarding'
        run: pwsh -File scripts/Test-Onboarding.ps1
      - name: Installed-package workflow with an existing earlier SDK policy
        if: matrix.suite == 'earlier-sdk'
        run: pwsh -File scripts/Test-Onboarding.ps1 -SdkVersion 10.0.103
      - name: Observed task-only tool environment identity
        if: matrix.suite == 'onboarding'
        run: |
          $file = Get-ChildItem .artifacts/onboarding -Filter validation.json -Recurse -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $report = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
          $reference = $report.failureHistory.restoredImplementation
          $record = Get-Content -LiteralPath (Join-Path $report.workspace ".tada/runs/$reference/run.json") -Raw | ConvertFrom-Json
          pwsh -File scripts/Test-TaskEnvironment.ps1 -Workspace $report.workspace -Baseline $record.baseline -ReferenceRun $reference
      - name: Prepare and install the download bundle
        if: matrix.suite == 'core'
        run: |
          [xml]$properties = Get-Content Directory.Build.props -Raw
          $version = [string]$properties.Project.PropertyGroup.Version
          $bundle = & ./scripts/New-ReleaseBundle.ps1 -Package ".artifacts/packages/Tada.Cli.$version.nupkg"
          pwsh -File scripts/Test-ReleaseBundle.ps1 -Archive $bundle.archive
      - name: Retain package and validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-validation-${{ matrix.suite }}-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            .artifacts/ci-identity.json
            .artifacts/packages/*.nupkg
            .artifacts/core-tests.log
            .artifacts/release-bundles/**/*.zip
            .artifacts/release-bundles/**/bundle.json
            .artifacts/plugin-bundles/**/*.zip
            .artifacts/plugin-bundles/**/plugin.json
            .artifacts/native/*.build.json
            .artifacts/native/tests/*.build.json
            .artifacts/**/validation.json
            .artifacts/**/enforcement-workflow.json
            .artifacts/**/run.json
            .artifacts/**/result.json
            .artifacts/**/tada-messages.ndjson
            .artifacts/**/supporting.trx
            .artifacts/alpha13-*.log
            .artifacts/multi-service/*/.tada/**
            .artifacts/orders-workflow/*/.tada/**
            .artifacts/onboarding/*/.tada/**
            !.artifacts/**/.tada/scratch/**
  required:
    name: PR checks
    if: always()
    needs: [windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful validation
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          if ($env:WINDOWS_RESULT -ne 'success') {
            throw "Windows validation ended with $env:WINDOWS_RESULT."
          }
