name: SonarCloud
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: tada-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  analyze:
    name: SonarCloud analysis
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'tayzer' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'tayzer_TADA' }}
      SONAR_SCANNER_VERSION: 12.1.0
    steps:
      # Fork PRs do not receive repository secrets. Skip analysis rather than
      # fail; this workflow is advisory and is not part of `PR checks`.
      - name: Check for SonarCloud token
        id: token
        run: |
          if ([string]::IsNullOrEmpty($env:SONAR_TOKEN)) {
            "SONAR_TOKEN is not available; SonarCloud analysis skipped." | Add-Content $env:GITHUB_STEP_SUMMARY
            "present=false" | Add-Content $env:GITHUB_OUTPUT
          } else {
            "present=true" | Add-Content $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.token.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: steps.token.outputs.present == 'true'
        with:
          dotnet-version: 10.0.403
      - name: Install SonarScanner for .NET
        if: steps.token.outputs.present == 'true'
        run: dotnet tool install dotnet-sonarscanner --version $env:SONAR_SCANNER_VERSION --tool-path .artifacts/sonar-scanner
      - name: Restore locked graphs
        if: steps.token.outputs.present == 'true'
        run: |
          dotnet restore tests/Tada.Core.Tests/Tada.Core.Tests.csproj --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet restore src/Tada.Cli/Tada.Cli.csproj --locked-mode
      - name: Analyse build
        if: steps.token.outputs.present == 'true'
        run: |
          $scanner = '.artifacts/sonar-scanner/dotnet-sonarscanner'
          & $scanner begin /k:"$env:SONAR_PROJECT_KEY" /o:"$env:SONAR_ORGANIZATION" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.exclusions="**/.tada/**,experiments/**,examples/**"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build tests/Tada.Core.Tests/Tada.Core.Tests.csproj --no-restore --disable-build-servers -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build src/Tada.Cli/Tada.Cli.csproj --no-restore --disable-build-servers -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $scanner end /d:sonar.token="$env:SONAR_TOKEN"
          exit $LASTEXITCODE
